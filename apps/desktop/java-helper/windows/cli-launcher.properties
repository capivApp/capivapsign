# Extra jpackage launcher: the CONSOLE entry point, for support and debugging.
#
# The main CapivaSign.exe is windowed on purpose — that is what keeps a cmd
# window from appearing next to the tray agent and on every deep link. But a
# windowed binary is detached from the console, so `list`/`sign` would print
# nowhere. This launcher restores that: win-console=true makes a
# console-subsystem binary whose stdout/stderr the operator can read.
#
# No `arguments` key: this launcher takes whatever the user types, e.g.
#   CapivaSignCli.exe list --source windows-my
#
# Wired up in package-windows.bat via:
#   --add-launcher CapivaSignCli=windows\cli-launcher.properties
# Produces dist\CapivaSign\CapivaSignCli.exe.
win-console=true
