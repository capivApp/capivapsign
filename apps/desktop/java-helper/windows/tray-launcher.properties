# Extra jpackage launcher: a WINDOWED (no console) entry point for the always-on
# tray agent. The main IcpAgent.exe keeps `--win-console` so the CLI commands
# (list / sign / debug) print to a console; this launcher omits it, so the agent
# the installer auto-starts at logon runs silently in the system tray with NO
# lingering console window — and AWT no longer prints "GetMessage() failed.
# System error 1400" into a console that has no message pump.
#
# Wired up in package-windows.bat via:
#   --add-launcher IcpAgentTray=windows\tray-launcher.properties
# Produces dist\IcpAgent\IcpAgentTray.exe, launched by installer.iss with no args.
arguments=serve --no-gui
